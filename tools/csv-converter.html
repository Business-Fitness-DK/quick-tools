<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Converter</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/brand.css">
  <style>
    .tool-container {
      max-width: 700px;
      margin: 0 auto;
    }

    .upload-section {
      margin-bottom: var(--spacing-xl);
    }

    .file-upload-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .actions .btn {
      flex: 1;
      min-width: 140px;
    }

    .success-message {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .success-message h2 {
      font-size: 1.125rem;
      margin-bottom: var(--spacing-sm);
    }

    .success-message p {
      font-size: .875rem;
      color: var(--text-secondary);
    }

    #alertArea { margin-top: 1rem; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="../index.html" class="logo">
        <img src="../assets/images/logo.png" alt="Logo">
        <span class="logo-text">Quick Tools from Business & Fitness</span>
      </a>
      <a href="../index.html" class="back-link">Back</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="tool-container">
      <h1 class="page-title">CSV Converter</h1>
      <p class="page-subtitle">Make your CSV comma-separated for importing into GHL</p>

      <!-- Upload Section -->
      <div class="upload-section" id="uploadSection">
        <div class="file-upload-area" id="dropZone">
          <div class="file-upload-icon">↑</div>
          <p class="upload-text">Drop CSV file or click to browse</p>
          <input type="file" id="fileInput" accept=".csv,.txt,.tsv" style="display: none;">
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
            Choose File
          </button>
        </div>
      </div>

      <section id="successSection" class="hidden" aria-label="Conversion complete">
        <div class="success-message">
          <h2>Your CSV is ready</h2>
          <p>Download the comma-separated file, then upload it to GHL.</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="downloadBtn" disabled>Download CSV</button>
          <button class="btn btn-secondary" id="resetBtn">Convert Another File</button>
        </div>
      </section>

      <!-- Alert Area -->
      <div id="alertArea" role="status" aria-live="polite"></div>

    </div>
  </main>

  <script>
    let convertedContent = '';
    let currentFileName = '';
    let readVersion = 0;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadSection = document.getElementById('uploadSection');
    const successSection = document.getElementById('successSection');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const alertArea = document.getElementById('alertArea');

    // Parse logical records, preserving quoted delimiters, escaped quotes and line breaks.
    function parseCSV(text, delimiter, inferOnly = false) {
      text = text.replace(/^\uFEFF/, '');
      const rows = [];
      let cells = [], cell = '', quoted = false, closed = false, line = 1, startLine = 1;
      function finishRow() {
        cells.push(cell);
        rows.push({ cells, line: startLine });
        cells = []; cell = ''; closed = false;
      }
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"') {
            if (text[i + 1] === '"') { cell += '"'; i++; }
            else { quoted = false; closed = true; }
          } else {
            cell += c;
            if (c === '\n' || (c === '\r' && text[i + 1] !== '\n')) line++;
          }
        } else if (c === delimiter) {
          cells.push(cell); cell = ''; closed = false;
        } else if (c === '\r' || c === '\n') {
          finishRow();
          if (c === '\r' && text[i + 1] === '\n') i++;
          line++; startLine = line;
        } else if (c === '"' && cell === '' && !closed) {
          quoted = true;
        } else {
          if (closed && !inferOnly) throw new Error(`Unexpected text after a closing quote on line ${line}. Fix that cell in the source file and upload it again.`);
          cell += c;
        }
      }
      if (quoted && !inferOnly) throw new Error(`A quoted cell starting in the record on line ${startLine} is not closed. Fix the quote in the source file.`);
      if (cells.length || cell !== '' || closed) finishRow();
      return rows;
    }

    function isBlank(row) { return row.cells.every(cell => cell.trim() === ''); }

    function detectFormat(text) {
      const directive = text.replace(/^\uFEFF/, '').match(/^sep=([;,\t])(?:\r\n|\r|\n|$)/i);
      const candidates = [';', ',', '\t'].map(delimiter => {
        try {
          // Infer even with a damaged quote so another separator cannot hide the error.
          // The selected format is always parsed strictly before a download is enabled.
          const rows = parseCSV(text, delimiter, true);
          const sample = rows.slice(directive ? 1 : 0, 101).filter(row => !isBlank(row));
          const counts = new Map();
          for (const row of sample) if (row.cells.length > 1) counts.set(row.cells.length, (counts.get(row.cells.length) || 0) + 1);
          const modes = [...counts].sort((a, b) => b[1] - a[1] || b[0] - a[0]);
          const width = modes[0]?.[0] || 1;
          const count = modes[0]?.[1] || 0;
          const score = count ? count / sample.length * Math.log2(width) * count / (count + 1) : 0;
          return { delimiter, rows, width, score, directive: directive?.[1] === delimiter };
        } catch (error) { return { delimiter, error, score: -1 }; }
      }).sort((a, b) => Number(b.directive || false) - Number(a.directive || false) || b.score - a.score);
      const best = candidates[0];
      if (best.error) throw best.error;
      // Only single-field title lines are safe enough to suggest skipping automatically.
      // A narrower multi-column row might be the real header of a damaged table.
      const minimum = directive ? 1 : 0;
      let start = best.rows.findIndex((row, index) => index >= minimum && !isBlank(row) && row.cells.length === best.width);
      if (best.rows.slice(minimum, start).some(row => !isBlank(row) && row.cells.length > 1)) {
        start = best.rows.findIndex((row, index) => index >= minimum && !isBlank(row));
      }
      return { delimiter: best.delimiter, start: Math.max(0, start) };
    }

    function serializeCSV(rows) {
      return rows.map(row => row.cells.map(cell => /[",\r\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell).join(',')).join('\r\n') + '\r\n';
    }

    function decodeFile(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes[0] === 0xff && bytes[1] === 0xfe) return { text: new TextDecoder('utf-16le', { fatal: true }).decode(bytes), note: '' };
      if (bytes[0] === 0xfe && bytes[1] === 0xff) return { text: new TextDecoder('utf-16be', { fatal: true }).decode(bytes), note: '' };
      try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), note: '' }; }
      catch { return { text: new TextDecoder('windows-1252').decode(bytes), note: 'If accented names look wrong after import, export the source as UTF-8 CSV and try again.' }; }
    }

    // File Upload
    dropZone.addEventListener('click', (e) => {
      if (e.target === dropZone || e.target.closest('.file-upload-icon') || e.target.closest('.upload-text')) {
        fileInput.click();
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    async function handleFile(file) {
      const version = ++readVersion;
      convertedContent = '';
      downloadBtn.disabled = true;
      successSection.classList.add('hidden');
      uploadSection.classList.remove('hidden');
      alertArea.replaceChildren();
      if (!/\.(csv|txt|tsv)$/i.test(file.name)) {
        showAlert('Please upload a CSV, TXT or TSV file. Export Excel workbooks as CSV first.', 'error');
        return;
      }
      if (file.size > 20 * 1024 * 1024) {
        showAlert('This file is larger than 20 MB. Split the export into smaller files and try again.', 'error');
        return;
      }
      try {
        const decoded = decodeFile(await file.arrayBuffer());
        if (version !== readVersion) return;
        if (decoded.text.includes('\0')) throw new Error('This file contains unsupported binary data. Export it as UTF-8 CSV and try again.');
        convertedContent = convertCSV(decoded.text);
        currentFileName = file.name;
        downloadBtn.disabled = false;
        successSection.classList.remove('hidden');
        uploadSection.classList.add('hidden');
        if (decoded.note) showAlert(decoded.note, 'success');
      } catch (error) {
        if (version !== readVersion) return;
        showAlert('Could not convert this file. ' + error.message, 'error');
      } finally {
        if (version === readVersion) fileInput.value = '';
      }
    }

    function convertCSV(text) {
      const detected = detectFormat(text);
      const parsed = parseCSV(text, detected.delimiter);
      const rows = parsed.slice(detected.start).filter(row => !isBlank(row));
      if (!rows.length) throw new Error('This file is empty. Upload a file with data.');
      const width = rows[0].cells.length;
      const mismatched = rows.find(row => row.cells.length !== width);
      if (mismatched) throw new Error(`Line ${mismatched.line} has ${mismatched.cells.length} columns instead of ${width}. Fix this row in the source file and upload it again.`);
      return serializeCSV(rows);
    }

    downloadBtn.addEventListener('click', () => {
      if (!convertedContent || downloadBtn.disabled) return;
      const blob = new Blob([convertedContent], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName.replace(/\.(csv|txt|tsv)$/i, '_converted.csv');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    resetBtn.addEventListener('click', () => {
      readVersion++;
      convertedContent = '';
      currentFileName = '';
      fileInput.value = '';
      uploadSection.classList.remove('hidden');
      successSection.classList.add('hidden');
      alertArea.replaceChildren();
      downloadBtn.disabled = true;
    });

    function showAlert(message, type) {
      const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
      const alert = document.createElement('div');
      alert.className = `alert ${alertClass}`;
      alert.textContent = message;
      alertArea.replaceChildren(alert);
    }
  </script>

</body>
</html>
